<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>循序漸進句子拼寫練習 App</title>
  <style>
    :root {
      --bg-main: #0f1117;
      --bg-card: #181b24;
      --bg-input: #222736;
      --accent-purple: #a855f7;
      --accent-purple-hover: #9333ea;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #ffffff;
      --text-muted: #6b7280;
      --border-color: #2e3548;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 頂部控制列 */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select, button {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:focus, button:hover {
      border-color: var(--accent-purple);
    }

    .btn-primary {
      background: var(--accent-purple);
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-purple-hover);
    }

    /* 主要內容區域 */
    main {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 40px 0;
      flex-grow: 1;
    }

    .prompt-container {
      text-align: center;
      margin-bottom: 50px;
    }

    .prompt-zh {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .prompt-ipa {
      font-size: 1.2rem;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.1);
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
    }

    .interactive-area {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      margin-bottom: 40px;
    }

    /* 單字排版容器 */
    .words-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 32px 14px;
      max-width: 900px;
      padding: 20px;
      margin-top: 20px;
    }

    .word-box {
      display: flex;
      align-items: flex-end;
      position: relative;
    }

    /* 獨立底線輸入框容器 */
    .input-wrapper {
      position: relative;
      display: inline-block;
      height: 48px;
      border-bottom: 2px solid #6b7280;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Consolas', 'Courier New', Courier, monospace !important;
      font-size: 32px !important;
      font-weight: 600 !important;
    }

    /* 聚焦狀態 */
    .input-wrapper.focus {
      border-bottom-color: #c084fc;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }

    /* 錯誤狀態 */
    .input-wrapper.error {
      border-bottom-color: var(--accent-red);
      animation: shake 0.3s ease-in-out;
    }

    /* 完成狀態 */
    .input-wrapper.correct {
      border-bottom-color: #c084fc;
    }

    /* 輸入框主體 */
    .word-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100% !important;
      font-family: inherit !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      line-height: 46px !important;
      text-align: center !important;
      letter-spacing: 1px !important;
      padding: 0 4px !important;
      margin: 0 !important;
      border: none !important;
      box-sizing: border-box !important;
      background: transparent !important;
      color: #ffffff;
      outline: none !important;
      z-index: 2;
      caret-color: #c084fc;
      -webkit-appearance: none;
      appearance: none;
    }

    .word-input.correct {
      color: #c084fc;
    }

    .word-input.error {
      color: var(--accent-red);
    }

    /* 上方浮水印提示層 */
    .watermark-layer {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: 600;
      color: #a855f7;
      white-space: nowrap;
      pointer-events: none;
      z-index: 3;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .wm-typed {
      color: rgba(255, 255, 255, 0.3);
    }

    .wm-untyped {
      color: #c084fc;
      text-decoration: underline;
    }

    /* 標點符號 */
    .punctuation {
      font-size: 32px;
      font-weight: 500;
      color: var(--text-main);
      margin-left: -6px;
      margin-right: 6px;
      padding-bottom: 2px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .status-banner {
      width: 100%;
      max-width: 700px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-input);
      border-color: var(--accent-purple);
    }

    .action-btn.purple {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .action-btn.purple:hover {
      background: var(--accent-purple-hover);
    }

    /* 匯入彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 650px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .modal-body textarea {
      width: 100%;
      height: 250px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ================= 句庫管理 / 進度相關樣式 ================= */
    .modal {
      max-height: 88vh;
      overflow-y: auto;
    }

    .btn-ghost {
      background: transparent;
    }

    .modal-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .modal-hint b {
      color: var(--text-main);
      font-weight: 600;
    }

    .export-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .export-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .export-head .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .export-head .btn-row button {
      font-size: 0.82rem;
      padding: 7px 11px;
    }

    .export-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .export-note code {
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
    }

    .export-text {
      width: 100%;
      height: 150px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .save-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translate(-50%, 12px);
      background: var(--bg-card);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 2000;
      pointer-events: none;
      max-width: 88vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <div class="control-item">
        <label for="voiceSelect">🔊 語音：</label>
        <select id="voiceSelect"><option>載入中...</option></select>
      </div>
      <div class="control-item">
        <label for="repeatCountSelect">🔁 錯3次自動朗讀次數：</label>
        <select id="repeatCountSelect">
          <option value="1">1 次</option>
          <option value="2">2 次</option>
          <option value="3" selected>3 次</option>
          <option value="4">4 次</option>
          <option value="5">5 次</option>
        </select>
      </div>
    </div>
    <div class="controls-group">
      <span class="save-chip" title="練到第幾句、哪些字已經打好，都會存在這台裝置；下次開啟直接接續">💾 自動記住進度</span>
      <button class="btn-primary" id="openImportBtn">📥 句庫管理</button>
    </div>
  </header>

  <main>
    <div class="prompt-container">
      <div class="prompt-zh" id="promptZh">載入中...</div>
      <div class="prompt-ipa" id="promptIpa">/ ... /</div>
    </div>

    <div class="interactive-area">
      <div class="words-container" id="wordsContainer"></div>
    </div>

    <div class="status-banner" id="statusBanner">
      <span>✔ 整句拼寫完成！按 <strong>Space</strong> 進入下一個單元，或按 <strong>Enter</strong> 重新練習本句。</span>
    </div>
  </main>

  <div class="bottom-bar">
    <button class="action-btn" id="speakFullBtn">
      <span>Alt + '</span> <span>▶ 朗讀全句</span>
    </button>
    <button class="action-btn" id="prevCardBtn">
      <span>Alt + P</span> <span>上一句</span>
    </button>
    <button class="action-btn" id="nextCardBtn">
      <span>Alt + N</span> <span>下一句</span>
    </button>
    <button class="action-btn purple" id="restartBtn">
      <span>Enter</span> <span>重練本句</span>
    </button>
  </div>

  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">句庫管理</div>
        <button id="closeImportBtn" style="background:transparent; border:none; font-size:1.2rem; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-hint" id="bankHint"></div>
        <textarea id="importTextarea" placeholder="請貼上句庫內容，格式：英文 = 中文 = 音標（一行一句）"></textarea>
      </div>
      <div class="modal-footer">
        <button id="useRepoBtn" class="btn-ghost" style="display:none">改用 GitHub 版句庫</button>
        <button id="cancelImportBtn">取消</button>
        <button class="btn-primary" id="submitImportBtn">確認匯入</button>
      </div>

      <div class="export-box">
        <div class="export-head">
          <span>📤 寫入 GitHub，讓所有裝置共用同一份句庫</span>
          <span class="btn-row">
            <button id="copyDataBtn">複製 data/sentences.js</button>
            <button id="downloadDataBtn">下載 sentences.js</button>
            <button id="clearLocalBtn" class="btn-ghost">🗑 清除本機記錄</button>
          </span>
        </div>
        <p class="export-note">
          按「下載」取得 <code>sentences.js</code>，放進專案的 <code>data/</code> 資料夾取代舊檔，再
          <code>git push</code>，之後所有裝置開啟就會共用這份句庫。<br>
          你自己匯入的內容與練習進度已經存在這台裝置，不用等 push 就能用。
        </p>
        <textarea id="exportText" class="export-text" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- 共用句庫：GitHub 上 data/sentences.js 的內容，會蓋掉 App 內建的預設句庫 -->
  <script src="data/sentences.js"></script>

  <script>
    const defaultRawText = `This = 這 = /ðɪs/
This is = 這是 = /ðɪs ɪz/
not planned = 未預先計劃的 = /nɑːt plænd/
This is not planned = 這不是預先計劃好的 = /ðɪs ɪz nɑːt plænd/
Oh no, this is not planned = 噢不，這完全不在計劃中 = /əʊ nəʊ, ðɪs ɪz nɑːt plænd/
Mr. President = 總統先生 = /ˈmɪstər ˈprezɪdənt/
calling = 來電 = /ˈkɔːlɪŋ/
If it wasn't because of you calling = 如果不是因為您打電話來 = /ɪf ɪt wɑːznˈt bɪˈkəz əv juː ˈkɔːlɪŋ/
I am on stage = 我正在舞台上 = /aɪ æm ɑːn steɪdʒ/
If it wasn't because of you calling, I am on stage with the besties. = 如果不是因為您打電話來，我現在正跟好朋友在台上呢。 = /ɪf ɪt wɑːznˈt bɪˈkəz əv juː ˈkɔːlɪŋ, aɪ æm ɑːn steɪdʒ wɪð ðə ˈbestiːz/`;

    /* ================= 儲存：句庫來源 + 練習進度 ================= */
    const STORAGE_BANK = 'wm.bank.v1';
    const STORAGE_PROGRESS = 'wm.progress.v1';

    function readStore(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return (v === null || v === undefined) ? fallback : v;
      } catch (e) { return fallback; }
    }
    function writeStore(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function removeStore(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }

    // GitHub 上的共用句庫（data/sentences.js）
    let repoRaw = (typeof window.SENTENCE_BANK === 'string' ? window.SENTENCE_BANK : '').trim();
    // 這台裝置自己匯入的句庫
    let localRaw = (readStore(STORAGE_BANK, '') || '').trim();
    // 上次練到哪裡
    let progress = { index: 0, sentence: '', correct: [] };

    let dataset = [];
    let currentIndex = 0;
    let selectedVoice = null;
    let wordErrorCounts = [];
    let isWatermarkActive = [];

    const promptZh = document.getElementById('promptZh');
    const promptIpa = document.getElementById('promptIpa');
    const wordsContainer = document.getElementById('wordsContainer');
    const voiceSelect = document.getElementById('voiceSelect');
    const repeatCountSelect = document.getElementById('repeatCountSelect');
    const statusBanner = document.getElementById('statusBanner');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const speakFullBtn = document.getElementById('speakFullBtn');
    const restartBtn = document.getElementById('restartBtn');

    const importModal = document.getElementById('importModal');
    const openImportBtn = document.getElementById('openImportBtn');
    const closeImportBtn = document.getElementById('closeImportBtn');
    const cancelImportBtn = document.getElementById('cancelImportBtn');
    const submitImportBtn = document.getElementById('submitImportBtn');
    const importTextarea = document.getElementById('importTextarea');
    const bankHint = document.getElementById('bankHint');
    const exportText = document.getElementById('exportText');
    const useRepoBtn = document.getElementById('useRepoBtn');

    /* ================= 句庫來源 ================= */
    function currentRaw() {
      if (localRaw) return localRaw;
      if (repoRaw) return repoRaw;
      return defaultRawText;
    }

    function bankSourceLabel() {
      if (localRaw) return '這台裝置匯入的句庫（' + parseRawText(localRaw).length + ' 句）';
      if (repoRaw) return 'GitHub 共用句庫（' + parseRawText(repoRaw).length + ' 句）';
      return 'App 內建預設句庫（' + parseRawText(defaultRawText).length + ' 句）';
    }

    function buildDataFile() {
      const safe = currentRaw().replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
      return '// data/sentences.js — 共用句庫（改完存檔、git push，所有裝置就會讀到這份）\n' +
             '//\n' +
             '// 格式：一行一句，英文 = 中文 = 音標\n' +
             '// 例：This = 這 = /ðɪs/\n' +
             '//\n' +
             '// 留空時 App 會改用 index.html 內建的預設句庫。\n' +
             '\n' +
             'window.SENTENCE_BANK = `\n' + safe + '\n`;\n';
    }

    function refreshBankPanel() {
      const count = parseRawText(currentRaw()).length;
      bankHint.innerHTML = '目前使用：<b>' + bankSourceLabel() + '</b><br>' +
        '匯入的內容會存在這台裝置，練習到第幾句也會一起記住；換瀏覽器或換手機仍在自己裝置上。';
      exportText.value = buildDataFile();
      useRepoBtn.style.display = (localRaw && repoRaw && localRaw !== repoRaw) ? 'inline-block' : 'none';
      importTextarea.placeholder = '請貼上句庫內容，格式：英文 = 中文 = 音標（目前 ' + count + ' 句）';
    }

    /* ================= 進度記錄 ================= */
    function loadProgress() {
      const raw = readStore(STORAGE_PROGRESS, '');
      if (!raw) return;
      try {
        const p = JSON.parse(raw);
        if (p && typeof p.index === 'number') {
          progress = {
            index: p.index,
            sentence: p.sentence || '',
            correct: Array.isArray(p.correct) ? p.correct : []
          };
        }
      } catch (e) {}
    }

    function collectCorrectIndexes() {
      return Array.from(wordsContainer.querySelectorAll('input'))
        .filter(i => i.value && i.value.toLowerCase() === (i.dataset.target || '').toLowerCase())
        .map(i => Number(i.dataset.index));
    }

    function saveProgress() {
      const card = dataset[currentIndex];
      progress.index = currentIndex;
      progress.sentence = card ? card.en : '';
      progress.correct = collectCorrectIndexes();
      writeStore(STORAGE_PROGRESS, JSON.stringify(progress));
    }

    function applyProgress() {
      const card = dataset[currentIndex];
      if (!card || progress.sentence !== card.en) return 0;
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      let done = 0;
      progress.correct.forEach(idx => {
        const input = inputs[idx];
        if (!input) return;
        input.value = input.dataset.target;
        input.classList.add('correct');
        const wrapper = input.closest('.input-wrapper');
        if (wrapper) wrapper.classList.add('correct');
        done++;
      });
      return done;
    }

    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
    }

    function parseRawText(text) {
      const lines = text.split('\n').filter(l => l.trim() !== '');
      return lines.map(line => {
        const parts = line.split(/=|＝/).map(p => p.trim());
        return {
          en: parts[0] || '',
          zh: parts[1] || '',
          ipa: parts[2] || ''
        };
      }).filter(item => item.en !== '');
    }

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';
      const englishVoices = voices.filter(v => v.lang.startsWith('en'));
      englishVoices.sort((a, b) => {
        const aScore = (a.name.includes('Google') ? 2 : 0) + (a.name.includes('Microsoft') ? 1 : 0);
        const bScore = (b.name.includes('Google') ? 2 : 0) + (b.name.includes('Microsoft') ? 1 : 0);
        return bScore - aScore;
      });
      englishVoices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
      if (englishVoices.length > 0) selectedVoice = englishVoices[0];
      voiceSelect.addEventListener('change', () => {
        selectedVoice = voices.find(v => v.name === voiceSelect.value);
      });
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakText(text, repeatCount = 1) {
      if (!('speechSynthesis' in window) || !text) return;
      const cleanText = text.replace(/[^a-zA-Z0-9\s']/g, '');
      if (!cleanText.trim()) return;
      speechSynthesis.cancel();
      for (let i = 0; i < repeatCount; i++) {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
      }
    }

    // restore=true 才會套用上次存下的進度（只有開啟網頁時呼叫）
    function renderCard(index, restore) {
      if (dataset.length === 0) return;
      currentIndex = index;
      const currentData = dataset[currentIndex];

      promptZh.textContent = currentData.zh;
      promptIpa.textContent = currentData.ipa || '';
      statusBanner.style.display = 'none';
      wordsContainer.innerHTML = '';

      const tokens = currentData.en.match(/([a-zA-Z0-9']+)|([^a-zA-Z0-9'\s]+)/g) || [];
      wordErrorCounts = [];
      isWatermarkActive = [];
      let wordIndex = 0;

      tokens.forEach((token) => {
        const isWord = /[a-zA-Z0-9']/.test(token);

        if (isWord) {
          const idx = wordIndex;
          wordErrorCounts[idx] = 0;
          isWatermarkActive[idx] = false;

          const wordBox = document.createElement('div');
          wordBox.className = 'word-box';

          const wrapper = document.createElement('div');
          wrapper.className = 'input-wrapper';

          const watermark = document.createElement('div');
          watermark.className = 'watermark-layer';
          watermark.id = `watermark_${idx}`;

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'word-input';
          input.dataset.target = token;
          input.dataset.index = idx;
          input.autocomplete = "off";
          input.autocorrect = "off";
          input.autocapitalize = "off";
          input.spellcheck = false;

          const charLength = Math.max(token.length, 1);
          wrapper.style.width = `calc(${charLength}ch + 1.2em)`;
          wrapper.style.minWidth = '2.5em';

          input.addEventListener('focus', () => wrapper.classList.add('focus'));
          input.addEventListener('blur', () => wrapper.classList.remove('focus'));
          input.addEventListener('input', (e) => handleWordInput(e, input, wrapper, watermark, token, idx));
          input.addEventListener('keydown', (e) => handleWordKeyDown(e, input, token, idx));

          wrapper.appendChild(watermark);
          wrapper.appendChild(input);
          wordBox.appendChild(wrapper);
          wordsContainer.appendChild(wordBox);

          wordIndex++;
        } else if (token.trim() !== '') {
          const punctSpan = document.createElement('span');
          punctSpan.className = 'punctuation';
          punctSpan.textContent = token;
          wordsContainer.appendChild(punctSpan);
        }
      });

      const restored = restore ? applyProgress() : 0;
      saveProgress();
      speakText(currentData.en, 1);
      setTimeout(() => {
        const inputs = Array.from(wordsContainer.querySelectorAll('input'));
        const firstEmpty = inputs.find(i => !i.classList.contains('correct'));
        const target = firstEmpty || inputs[inputs.length - 1];
        if (target) target.focus();
      }, 50);

      if (restored > 0) {
        toast('已接續上次進度：第 ' + (currentIndex + 1) + ' 句，已打好 ' + restored + ' 個字');
      } else if (restore && currentIndex > 0) {
        toast('已回到上次練習的第 ' + (currentIndex + 1) + ' 句（共 ' + dataset.length + ' 句）');
      }
    }

    function updateWatermark(input, watermarkLayer, targetWord) {
      const typed = input.value;
      if (targetWord.toLowerCase().startsWith(typed.toLowerCase())) {
        const typedLen = typed.length;
        const matchedPart = targetWord.substring(0, typedLen);
        const remainingPart = targetWord.substring(typedLen);
        watermarkLayer.innerHTML = `<span class="wm-typed">${matchedPart}</span><span class="wm-untyped">${remainingPart}</span>`;
      } else {
        watermarkLayer.innerHTML = `<span class="wm-untyped">${targetWord}</span>`;
      }
    }

    function handleWordInput(e, input, wrapper, watermarkLayer, targetWord, wordIdx) {
      const value = input.value;
      if (!targetWord.toLowerCase().startsWith(value.toLowerCase())) {
        input.classList.add('error');
        wrapper.classList.add('error');
        wrapper.classList.remove('correct');
        input.classList.remove('correct');
        wordErrorCounts[wordIdx]++;

        // 錯滿 3 次即觸發浮水印與朗讀
        if (wordErrorCounts[wordIdx] >= 3) {
          isWatermarkActive[wordIdx] = true;
          updateWatermark(input, watermarkLayer, targetWord);
          const repeatTimes = parseInt(repeatCountSelect.value, 10) || 3;
          speakText(targetWord, repeatTimes);
        }
      } else {
        input.classList.remove('error');
        wrapper.classList.remove('error');

        if (isWatermarkActive[wordIdx]) {
          updateWatermark(input, watermarkLayer, targetWord);
        }

        if (value.toLowerCase() === targetWord.toLowerCase()) {
          input.value = targetWord;
          watermarkLayer.innerHTML = '';
          input.classList.add('correct');
          wrapper.classList.add('correct');
          focusNextInput(wordIdx);
          checkSentenceCompletion();
          saveProgress();
        }
      }
    }

    function handleWordKeyDown(e, input, targetWord, wordIdx) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (isSentenceComplete()) {
          nextCard();
        } else {
          speakText(targetWord, 1);
        }
        return;
      }
      if (input.classList.contains('error')) {
        if (e.key !== 'Backspace' && e.key !== 'Delete' && !e.ctrlKey && !e.altKey && e.key !== 'Enter') {
          e.preventDefault();
        }
      }
    }

    function focusNextInput(currentIdx) {
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      if (currentIdx + 1 < inputs.length) {
        inputs[currentIdx + 1].focus();
      }
    }

    function isSentenceComplete() {
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      return inputs.every(input => input.value.toLowerCase() === input.dataset.target.toLowerCase());
    }

    function checkSentenceCompletion() {
      if (isSentenceComplete()) {
        statusBanner.style.display = 'flex';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === "'" || e.code === 'Quote')) {
        e.preventDefault();
        speakText(dataset[currentIndex].en, 1);
        return;
      }
      if (e.altKey && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        nextCard();
        return;
      }
      if (e.altKey && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        prevCard();
        return;
      }
      if (e.key === 'Enter') {
        const isModalOpen = importModal.style.display === 'flex';
        if (!isModalOpen) {
          e.preventDefault();
          renderCard(currentIndex);
        }
      }
      if (document.activeElement.tagName !== 'TEXTAREA') {
        if (e.key === 'ArrowRight') nextCard();
        else if (e.key === 'ArrowLeft') prevCard();
      }
    });

    function nextCard() {
      if (currentIndex < dataset.length - 1) renderCard(currentIndex + 1);
    }
    function prevCard() {
      if (currentIndex > 0) renderCard(currentIndex - 1);
    }

    prevCardBtn.addEventListener('click', prevCard);
    nextCardBtn.addEventListener('click', nextCard);
    speakFullBtn.addEventListener('click', () => speakText(dataset[currentIndex].en, 1));
    restartBtn.addEventListener('click', () => renderCard(currentIndex));

    /* ================= 句庫管理 ================= */
    openImportBtn.addEventListener('click', () => {
      refreshBankPanel();
      importModal.style.display = 'flex';
    });
    closeImportBtn.addEventListener('click', () => { importModal.style.display = 'none'; });
    cancelImportBtn.addEventListener('click', () => { importModal.style.display = 'none'; });

    useRepoBtn.addEventListener('click', () => {
      localRaw = '';
      removeStore(STORAGE_BANK);
      progress = { index: 0, sentence: '', correct: [] };
      removeStore(STORAGE_PROGRESS);
      dataset = parseRawText(currentRaw());
      if (dataset.length === 0) dataset = parseRawText(defaultRawText);
      renderCard(0, true);
      refreshBankPanel();
      toast('已改用 GitHub 上的共用句庫');
    });

    submitImportBtn.addEventListener('click', () => {
      const customText = importTextarea.value.trim();
      if (!customText) return;
      const parsed = parseRawText(customText);
      if (parsed.length === 0) {
        alert('無法解析，請確認格式為：英文 = 中文 = 音標');
        return;
      }
      localRaw = customText;
      writeStore(STORAGE_BANK, customText);
      progress = { index: 0, sentence: '', correct: [] };
      removeStore(STORAGE_PROGRESS);
      dataset = parsed;
      renderCard(0, true);
      refreshBankPanel();
      importModal.style.display = 'none';
      toast('已匯入 ' + parsed.length + ' 句，進度從第 1 句重新開始');
    });

    document.getElementById('copyDataBtn').addEventListener('click', async () => {
      const text = exportText.value;
      try {
        await navigator.clipboard.writeText(text);
        toast('已複製，貼回專案的 data/sentences.js 再 push 即可');
      } catch (e) {
        exportText.removeAttribute('readonly');
        exportText.select();
        try { document.execCommand('copy'); } catch (e2) {}
        exportText.setAttribute('readonly', 'readonly');
        toast('已複製到剪貼簿');
      }
    });

    document.getElementById('downloadDataBtn').addEventListener('click', () => {
      const blob = new Blob([exportText.value], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sentences.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('已下載 sentences.js，放進專案的 data/ 資料夾後 git push');
    });

    document.getElementById('clearLocalBtn').addEventListener('click', () => {
      if (!confirm('確定要清除這台裝置的句庫與練習進度嗎？\n（GitHub 上的共用句庫不受影響）')) return;
      removeStore(STORAGE_BANK);
      removeStore(STORAGE_PROGRESS);
      localRaw = '';
      progress = { index: 0, sentence: '', correct: [] };
      dataset = parseRawText(currentRaw());
      if (dataset.length === 0) dataset = parseRawText(defaultRawText);
      renderCard(0, true);
      refreshBankPanel();
      toast('已清除本機記錄');
    });

    /* ================= 啟動：接續上次的進度 ================= */
    loadProgress();
    dataset = parseRawText(currentRaw());
    if (dataset.length === 0) dataset = parseRawText(defaultRawText);
    const resumeIndex = Math.min(Math.max(progress.index, 0), Math.max(dataset.length - 1, 0));
    renderCard(resumeIndex, true);
  </script>
</body>
</html>
