<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordMomo — 互動式英語學習</title>
<meta name="description" content="WordMomo：純前端互動式英語單字學習網站。單字卡、語音發音、四種測驗模式與間隔重複複習。">
<meta name="theme-color" content="#0f1020">
<meta property="og:title" content="WordMomo — 互動式英語學習">
<meta property="og:description" content="用單字卡、語音與測驗，把英文單字真正記住。">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 啟動畫面 ============ -->
<div id="splash" class="splash">
  <div class="splash__logo">momo</div>
  <div class="splash__bar"><i></i></div>
</div>

<!-- ============ 頂部列 ============ -->
<header class="topbar">
  <a class="brand" href="#/" aria-label="回到儀表板">
    <span class="brand__mark">momo</span>
  </a>

  <nav class="nav" id="nav">
    <a class="nav__link" href="#/" data-view="dashboard"><span class="nav__ico">◎</span>儀表板</a>
    <a class="nav__link" href="#/study" data-view="study"><span class="nav__ico">▤</span>單字卡</a>
    <a class="nav__link" href="#/quiz"  data-view="quiz"><span class="nav__ico">✎</span>測驗</a>
    <a class="nav__link" href="#/stats" data-view="stats"><span class="nav__ico">▦</span>統計</a>
  </nav>

  <div class="topbar__right">
    <div class="streak-chip" id="streakChip" title="連續學習天數">
      <span class="streak-chip__flame">🔥</span>
      <span id="streakNum">0</span><span class="streak-chip__unit">天</span>
    </div>
    <button class="icon-btn" id="themeBtn" title="切換深色／淺色模式" aria-label="切換佈景主題">◐</button>
    <button class="icon-btn" data-open-settings title="設定" aria-label="開啟設定">⚙</button>
  </div>
</header>

<!-- ============ 主內容 ============ -->
<main id="app" class="app" role="main"></main>

<!-- ============ 底部行動列（手機） ============ -->
<nav class="tabbar" id="tabbar">
  <a class="tabbar__link" href="#/"            data-view="dashboard"><span>◎</span>儀表板</a>
  <a class="tabbar__link" href="#/study"       data-view="study"><span>▤</span>單字卡</a>
  <a class="tabbar__link" href="#/quiz"        data-view="quiz"><span>✎</span>測驗</a>
  <a class="tabbar__link" href="#/stats"       data-view="stats"><span>▦</span>統計</a>
</nav>

<!-- ============ 設定抽屜 ============ -->
<div class="drawer" id="settingsDrawer" hidden>
  <div class="drawer__scrim" data-close-drawer></div>
  <div class="drawer__panel" role="dialog" aria-label="設定">
    <header class="drawer__head">
      <h2>設定</h2>
      <button class="icon-btn" data-close-drawer aria-label="關閉">✕</button>
    </header>

    <div class="drawer__body">
      <section class="field">
        <label for="setGoal">每日目標（張單字卡）</label>
        <div class="field__row">
          <input type="range" id="setGoal" min="5" max="100" step="5">
          <output id="setGoalOut">20</output>
        </div>
      </section>

      <section class="field">
        <label for="setSpeechRate">發音語速</label>
        <div class="field__row">
          <input type="range" id="setSpeechRate" min="0.5" max="1.3" step="0.05">
          <output id="setSpeechRateOut">0.9</output>
        </div>
      </section>

      <section class="field">
        <label for="setVoice">發音聲音</label>
        <select id="setVoice"></select>
        <p class="hint" id="voiceHint">正在偵測瀏覽器語音…</p>
      </section>

      <section class="field field--row">
        <label for="setAutoPlay">自動播放發音</label>
        <input type="checkbox" id="setAutoPlay" class="switch">
      </section>

      <section class="field field--row">
        <label for="setZhFirst">單字卡先看中文</label>
        <input type="checkbox" id="setZhFirst" class="switch">
      </section>

      <section class="field">
        <div class="btn-row">
          <button class="btn btn--ghost" id="exportBtn">匯出進度</button>
          <button class="btn btn--ghost" id="importBtn">匯入進度</button>
        </div>
        <input type="file" id="importFile" accept="application/json" hidden>
        <p class="hint">把瀏覽器內的學習紀錄存成 JSON，或在其他裝置還原。</p>
      </section>

      <section class="field">
        <div class="btn-row">
          <button class="btn btn--danger" id="resetBtn">清除全部進度</button>
        </div>
        <p class="hint">此操作無法復原，請先匯出備份。</p>
      </section>
    </div>
  </div>
</div>

<!-- ============ 全域提示 ============ -->
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
