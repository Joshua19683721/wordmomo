<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>循序漸進句子拼寫練習 App</title>
  <style>
    :root {
      --bg-main: #0f1117;
      --bg-card: #181b24;
      --bg-input: #222736;
      --accent-purple: #a855f7;
      --accent-purple-hover: #9333ea;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #ffffff;
      --text-muted: #6b7280;
      --border-color: #2e3548;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 頂部控制列 */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select, button {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:focus, button:hover {
      border-color: var(--accent-purple);
    }

    .btn-primary {
      background: var(--accent-purple);
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-purple-hover);
    }

    /* 主要內容區域 */
    main {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 40px 0;
      flex-grow: 1;
    }

    .prompt-container {
      text-align: center;
      margin-bottom: 50px;
    }

    .prompt-zh {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .prompt-ipa {
      font-size: 1.2rem;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.1);
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
    }

    .interactive-area {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      margin-bottom: 40px;
    }

    /* 單字排版容器 */
    .words-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 32px 14px;
      max-width: 900px;
      padding: 20px;
      margin-top: 20px;
    }

    .word-box {
      display: flex;
      align-items: flex-end;
      position: relative;
    }

    /* 獨立底線輸入框容器 */
    .input-wrapper {
      position: relative;
      display: inline-block;
      height: 48px;
      border-bottom: 2px solid #6b7280;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Consolas', 'Courier New', Courier, monospace !important;
      font-size: 32px !important;
      font-weight: 600 !important;
    }

    /* 聚焦狀態 */
    .input-wrapper.focus {
      border-bottom-color: #c084fc;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }

    /* 錯誤狀態 */
    .input-wrapper.error {
      border-bottom-color: var(--accent-red);
      animation: shake 0.3s ease-in-out;
    }

    /* 完成狀態 */
    .input-wrapper.correct {
      border-bottom-color: #c084fc;
    }

    /* 輸入框主體 */
    .word-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100% !important;
      font-family: inherit !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      line-height: 46px !important;
      text-align: center !important;
      letter-spacing: 1px !important;
      padding: 0 4px !important;
      margin: 0 !important;
      border: none !important;
      box-sizing: border-box !important;
      background: transparent !important;
      color: #ffffff;
      outline: none !important;
      z-index: 2;
      caret-color: #c084fc;
      -webkit-appearance: none;
      appearance: none;
    }

    .word-input.correct {
      color: #c084fc;
    }

    .word-input.error {
      color: var(--accent-red);
    }

    /* 上方浮水印提示層 */
    .watermark-layer {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: 600;
      color: #a855f7;
      white-space: nowrap;
      pointer-events: none;
      z-index: 3;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .wm-typed {
      color: rgba(255, 255, 255, 0.3);
    }

    .wm-untyped {
      color: #c084fc;
      text-decoration: underline;
    }

    /* 標點符號 */
    .punctuation {
      font-size: 32px;
      font-weight: 500;
      color: var(--text-main);
      margin-left: -6px;
      margin-right: 6px;
      padding-bottom: 2px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .status-banner {
      width: 100%;
      max-width: 700px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-input);
      border-color: var(--accent-purple);
    }

    .action-btn.purple {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .action-btn.purple:hover {
      background: var(--accent-purple-hover);
    }

    /* 匯入彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 650px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .modal-body textarea {
      width: 100%;
      height: 250px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ================= 句庫管理 / 進度相關樣式 ================= */
    .modal {
      max-height: 88vh;
      overflow-y: auto;
    }

    .btn-ghost {
      background: transparent;
    }

    .modal-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .modal-hint b {
      color: var(--text-main);
      font-weight: 600;
    }

    .export-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .export-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .export-head .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .export-head .btn-row button {
      font-size: 0.82rem;
      padding: 7px 11px;
    }

    .export-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .export-note code {
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
    }

    .export-text {
      width: 100%;
      height: 150px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    .save-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translate(-50%, 12px);
      background: var(--bg-card);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 2000;
      pointer-events: none;
      max-width: 88vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= 「解析這一句」面板 ================= */
    .explain-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--accent-purple);
      border: 1px solid var(--accent-purple);
      color: #ffffff;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .explain-btn:hover {
      background: var(--accent-purple-hover);
      border-color: var(--accent-purple-hover);
    }

    .status-banner.complete .explain-btn {
      display: inline-flex;
    }

    .explain-scrim {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 1400;
    }

    .explain-scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .explain-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(780px, 100vw);
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1500;
      display: flex;
      flex-direction: column;
    }

    .explain-panel.open {
      transform: translateX(0);
    }

    .explain__head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .explain__head h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .explain__sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
    }

    .explain__close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      padding: 4px 8px;
      flex-shrink: 0;
    }

    .explain__body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 56px;
    }

    .ex-sentence {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .ex-sentence__en {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.7;
      word-break: break-word;
    }

    .ex-sentence__meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.7;
    }

    .ex-sentence__ipa {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      color: #c084fc;
    }

    .ex-headline {
      font-size: 0.9rem;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.12);
      border-left: 3px solid var(--accent-purple);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .ex-section {
      margin-bottom: 28px;
    }

    .ex-section__title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .ex-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .ex-table th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.76rem;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .ex-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(46, 53, 72, 0.6);
      vertical-align: top;
      line-height: 1.75;
    }

    .ex-table td.en {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.82rem;
    }

    .ex-cell--ok { color: #6ee7b7; }
    .ex-cell--bad { color: #fca5a5; }

    .mark {
      display: inline-block;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 5px;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      line-height: 1.5;
    }

    .mark-O {
      color: #10b981;
      background: rgba(16, 185, 129, 0.16);
    }

    .mark-X {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.16);
    }

    .ex-examples {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ex-example {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--bg-input);
    }

    .ex-example--bad {
      border-color: rgba(239, 68, 68, 0.45);
    }

    .ex-example__text {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.7;
      word-break: break-word;
    }

    .ex-example--ok .ex-example__text { color: #6ee7b7; }
    .ex-example--bad .ex-example__text { color: #fca5a5; }

    .ex-example__note {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.75;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-list li {
      font-size: 0.86rem;
      line-height: 1.8;
      padding-left: 18px;
      position: relative;
    }

    .ex-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent-purple);
    }

    .ex-empty {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.8;
      background: var(--bg-input);
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 680px) {
      .explain-panel { width: 100vw; }
      .explain__head, .explain__body { padding-left: 16px; padding-right: 16px; }
      .ex-table thead { display: none; }
      .ex-table, .ex-table tbody, .ex-table tr, .ex-table td { display: block; width: 100%; }
      .ex-table tr {
        border: 1px solid var(--border-color);
        border-radius: 10px;
        margin-bottom: 12px;
        padding: 6px 4px;
      }
      .ex-table td { border-bottom: none; padding: 6px 10px; }
      .ex-table td::before {
        content: attr(data-label);
        display: block;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 3px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <div class="control-item">
        <label for="voiceSelect">🔊 語音：</label>
        <select id="voiceSelect"><option>載入中...</option></select>
      </div>
      <div class="control-item">
        <label for="repeatCountSelect">🔁 錯3次自動朗讀次數：</label>
        <select id="repeatCountSelect">
          <option value="1">1 次</option>
          <option value="2">2 次</option>
          <option value="3" selected>3 次</option>
          <option value="4">4 次</option>
          <option value="5">5 次</option>
        </select>
      </div>
    </div>
    <div class="controls-group">
      <span class="save-chip" title="練到第幾句、哪些字已經打好，都會存在這台裝置；下次開啟直接接續">💾 自動記住進度</span>
      <button class="btn-primary" id="openImportBtn">📥 句庫管理</button>
    </div>
  </header>

  <main>
    <div class="prompt-container">
      <div class="prompt-zh" id="promptZh">載入中...</div>
      <div class="prompt-ipa" id="promptIpa">/ ... /</div>
    </div>

    <div class="interactive-area">
      <div class="words-container" id="wordsContainer"></div>
    </div>

    <div class="status-banner" id="statusBanner">
      <span>✔ 整句拼寫完成！按 <strong>Space</strong> 進入下一個單元，或按 <strong>Enter</strong> 重新練習本句。</span>
      <button class="explain-btn" id="explainBtn">📖 解析這一句</button>
    </div>
  </main>

  <div class="bottom-bar">
    <button class="action-btn" id="speakFullBtn">
      <span>Alt + '</span> <span>▶ 朗讀全句</span>
    </button>
    <button class="action-btn" id="prevCardBtn">
      <span>Alt + P</span> <span>上一句</span>
    </button>
    <button class="action-btn" id="nextCardBtn">
      <span>Alt + N</span> <span>下一句</span>
    </button>
    <button class="action-btn purple" id="restartBtn">
      <span>Enter</span> <span>重練本句</span>
    </button>
  </div>

  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">句庫管理</div>
        <button id="closeImportBtn" style="background:transparent; border:none; font-size:1.2rem; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-hint" id="bankHint"></div>
        <textarea id="importTextarea" placeholder="請貼上句庫內容，格式：英文 = 中文 = 音標（一行一句）"></textarea>
      </div>
      <div class="modal-footer">
        <button id="useRepoBtn" class="btn-ghost" style="display:none">改用 GitHub 版句庫</button>
        <button id="cancelImportBtn">取消</button>
        <button class="btn-primary" id="submitImportBtn">確認匯入</button>
      </div>

      <div class="export-box">
        <div class="export-head">
          <span>📤 寫入 GitHub，讓所有裝置共用同一份句庫</span>
          <span class="btn-row">
            <button id="copyDataBtn">複製 data/sentences.js</button>
            <button id="downloadDataBtn">下載 sentences.js</button>
            <button id="clearLocalBtn" class="btn-ghost">🗑 清除本機記錄</button>
          </span>
        </div>
        <p class="export-note">
          按「下載」取得 <code>sentences.js</code>，放進專案的 <code>data/</code> 資料夾取代舊檔，再
          <code>git push</code>，之後所有裝置開啟就會共用這份句庫。<br>
          你自己匯入的內容與練習進度已經存在這台裝置，不用等 push 就能用。
        </p>
        <textarea id="exportText" class="export-text" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- 解析面板：從右側滑入 -->
  <div class="explain-scrim" id="explainScrim"></div>
  <aside class="explain-panel" id="explainPanel" aria-label="這一句的解析">
    <header class="explain__head">
      <div>
        <h2>📖 這一句的解析</h2>
        <p class="explain__sub" id="explainSub"></p>
      </div>
      <button class="explain__close" id="explainClose" aria-label="關閉解析">✕</button>
    </header>
    <div class="explain__body" id="explainBody"></div>
  </aside>

  <!-- 共用句庫：GitHub 上 data/sentences.js 的內容，會蓋掉 App 內建的預設句庫 -->
  <script src="data/sentences.js"></script>
  <!-- 老師寫好的解析庫：GitHub 上 data/analysis.js；沒有的句子會用自動檢查提示 -->
  <script src="data/analysis.js"></script>

  <script>
    const defaultRawText = `This = 這 = /ðɪs/
This is = 這是 = /ðɪs ɪz/
not planned = 未預先計劃的 = /nɑːt plænd/
This is not planned = 這不是預先計劃好的 = /ðɪs ɪz nɑːt plænd/
Oh no, this is not planned = 噢不，這完全不在計劃中 = /əʊ nəʊ, ðɪs ɪz nɑːt plænd/
Mr. President = 總統先生 = /ˈmɪstər ˈprezɪdənt/
calling = 來電 = /ˈkɔːlɪŋ/
If it wasn't because of you calling = 如果不是因為您打電話來 = /ɪf ɪt wɑːznˈt bɪˈkəz əv juː ˈkɔːlɪŋ/
I am on stage = 我正在舞台上 = /aɪ æm ɑːn steɪdʒ/
If it wasn't because of you calling, I am on stage with the besties. = 如果不是因為您打電話來，我現在正跟好朋友在台上呢。 = /ɪf ɪt wɑːznˈt bɪˈkəz əv juː ˈkɔːlɪŋ, aɪ æm ɑːn steɪdʒ wɪð ðə ˈbestiːz/
kinds of animals = 各種動物 = /ˈkaɪndz əv ˈænɪ.məlz/
There are many kinds of animals in the zoo. = 動物園裡有許多種動物。 = /ðeər ɑː ˈmeni ˈkaɪndz əv ˈænɪ.məlz ɪn ðə zuː/
How many kinds of animals can you see in this picture? = 你在這張圖片裡看得到多少種動物？ = /haʊ ˈmeni ˈkaɪndz əv ˈænɪ.məlz kən juː siː ɪn ðɪs ˈpɪkʃə/
My brother is interested in animals. = 我弟弟對動物感興趣。 = /maɪ ˈbrʌðər ɪz ˈɪntrəstɪd ɪn ˈænɪ.məlz/
The elephant is bigger than the horse. = 大象比馬大。 = /ðiː ˈelɪfənt ɪz ˈbɪɡər ðæn ðə hɔːs/
She has three pets at home. = 她家裡有三隻寵物。 = /ʃiː hæz θriː pets ət həʊm/
These animals are endangered. = 這些動物是瀕危的。 = /ðiːz ˈænɪ.məlz ɑːr ɪnˈdaʒəd/
We should protect animals. = 我們應該保護動物。 = /wiː ʃʊd prəˈtekt ˈænɪ.məlz/
Do not feed the animals. = 不要餵食動物。 = /duː nəʊt fiːd ðiː ˈænɪ.məlz/
The zoo is closed every Monday. = 動物園每週一休館。 = /ðə zuː ɪz kləʊzd ˈevri ˈmʌndeɪ/`;

    /* ================= 儲存：句庫來源 + 練習進度 ================= */
    const STORAGE_BANK = 'wm.bank.v1';
    const STORAGE_PROGRESS = 'wm.progress.v1';

    function readStore(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return (v === null || v === undefined) ? fallback : v;
      } catch (e) { return fallback; }
    }
    function writeStore(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function removeStore(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }

    // GitHub 上的共用句庫（data/sentences.js）
    let repoRaw = (typeof window.SENTENCE_BANK === 'string' ? window.SENTENCE_BANK : '').trim();
    // 這台裝置自己匯入的句庫
    let localRaw = (readStore(STORAGE_BANK, '') || '').trim();
    // 上次練到哪裡
    let progress = { index: 0, sentence: '', correct: [] };

    let dataset = [];
    let currentIndex = 0;
    let selectedVoice = null;
    let wordErrorCounts = [];
    let isWatermarkActive = [];

    const promptZh = document.getElementById('promptZh');
    const promptIpa = document.getElementById('promptIpa');
    const wordsContainer = document.getElementById('wordsContainer');
    const voiceSelect = document.getElementById('voiceSelect');
    const repeatCountSelect = document.getElementById('repeatCountSelect');
    const statusBanner = document.getElementById('statusBanner');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const speakFullBtn = document.getElementById('speakFullBtn');
    const restartBtn = document.getElementById('restartBtn');

    const importModal = document.getElementById('importModal');
    const openImportBtn = document.getElementById('openImportBtn');
    const closeImportBtn = document.getElementById('closeImportBtn');
    const cancelImportBtn = document.getElementById('cancelImportBtn');
    const submitImportBtn = document.getElementById('submitImportBtn');
    const importTextarea = document.getElementById('importTextarea');
    const bankHint = document.getElementById('bankHint');
    const exportText = document.getElementById('exportText');
    const useRepoBtn = document.getElementById('useRepoBtn');

    const explainPanel = document.getElementById('explainPanel');
    const explainScrim = document.getElementById('explainScrim');
    const explainBody = document.getElementById('explainBody');
    const explainSub = document.getElementById('explainSub');
    const explainBtn = document.getElementById('explainBtn');
    const explainClose = document.getElementById('explainClose');

    /* ================= 句庫來源 ================= */
    function currentRaw() {
      if (localRaw) return localRaw;
      if (repoRaw) return repoRaw;
      return defaultRawText;
    }

    function bankSourceLabel() {
      if (localRaw) return '這台裝置匯入的句庫（' + parseRawText(localRaw).length + ' 句）';
      if (repoRaw) return 'GitHub 共用句庫（' + parseRawText(repoRaw).length + ' 句）';
      return 'App 內建預設句庫（' + parseRawText(defaultRawText).length + ' 句）';
    }

    function buildDataFile() {
      const safe = currentRaw().replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
      return '// data/sentences.js — 共用句庫（改完存檔、git push，所有裝置就會讀到這份）\n' +
             '//\n' +
             '// 格式：一行一句，英文 = 中文 = 音標\n' +
             '// 例：This = 這 = /ðɪs/\n' +
             '//\n' +
             '// 留空時 App 會改用 index.html 內建的預設句庫。\n' +
             '\n' +
             'window.SENTENCE_BANK = `\n' + safe + '\n`;\n';
    }

    function refreshBankPanel() {
      const count = parseRawText(currentRaw()).length;
      bankHint.innerHTML = '目前使用：<b>' + bankSourceLabel() + '</b><br>' +
        '匯入的內容會存在這台裝置，練習到第幾句也會一起記住；換瀏覽器或換手機仍在自己裝置上。';
      exportText.value = buildDataFile();
      useRepoBtn.style.display = (localRaw && repoRaw && localRaw !== repoRaw) ? 'inline-block' : 'none';
      importTextarea.placeholder = '請貼上句庫內容，格式：英文 = 中文 = 音標（目前 ' + count + ' 句）';
    }

    /* ================= 進度記錄 ================= */
    function loadProgress() {
      const raw = readStore(STORAGE_PROGRESS, '');
      if (!raw) return;
      try {
        const p = JSON.parse(raw);
        if (p && typeof p.index === 'number') {
          progress = {
            index: p.index,
            sentence: p.sentence || '',
            correct: Array.isArray(p.correct) ? p.correct : []
          };
        }
      } catch (e) {}
    }

    function collectCorrectIndexes() {
      return Array.from(wordsContainer.querySelectorAll('input'))
        .filter(i => i.value && i.value.toLowerCase() === (i.dataset.target || '').toLowerCase())
        .map(i => Number(i.dataset.index));
    }

    function saveProgress() {
      const card = dataset[currentIndex];
      progress.index = currentIndex;
      progress.sentence = card ? card.en : '';
      progress.correct = collectCorrectIndexes();
      writeStore(STORAGE_PROGRESS, JSON.stringify(progress));
    }

    function applyProgress() {
      const card = dataset[currentIndex];
      if (!card || progress.sentence !== card.en) return 0;
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      let done = 0;
      progress.correct.forEach(idx => {
        const input = inputs[idx];
        if (!input) return;
        input.value = input.dataset.target;
        input.classList.add('correct');
        const wrapper = input.closest('.input-wrapper');
        if (wrapper) wrapper.classList.add('correct');
        done++;
      });
      return done;
    }

    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
    }

    function parseRawText(text) {
      const lines = text.split('\n').filter(l => l.trim() !== '');
      return lines.map(line => {
        const parts = line.split(/=|＝/).map(p => p.trim());
        return {
          en: parts[0] || '',
          zh: parts[1] || '',
          ipa: parts[2] || ''
        };
      }).filter(item => item.en !== '');
    }

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';
      const englishVoices = voices.filter(v => v.lang.startsWith('en'));
      englishVoices.sort((a, b) => {
        const aScore = (a.name.includes('Google') ? 2 : 0) + (a.name.includes('Microsoft') ? 1 : 0);
        const bScore = (b.name.includes('Google') ? 2 : 0) + (b.name.includes('Microsoft') ? 1 : 0);
        return bScore - aScore;
      });
      englishVoices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
      if (englishVoices.length > 0) selectedVoice = englishVoices[0];
      voiceSelect.addEventListener('change', () => {
        selectedVoice = voices.find(v => v.name === voiceSelect.value);
      });
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakText(text, repeatCount = 1) {
      if (!('speechSynthesis' in window) || !text) return;
      const cleanText = text.replace(/[^a-zA-Z0-9\s']/g, '');
      if (!cleanText.trim()) return;
      speechSynthesis.cancel();
      for (let i = 0; i < repeatCount; i++) {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
      }
    }

    // restore=true 才會套用上次存下的進度（只有開啟網頁時呼叫）
    function renderCard(index, restore) {
      if (dataset.length === 0) return;
      currentIndex = index;
      const currentData = dataset[currentIndex];

      promptZh.textContent = currentData.zh;
      promptIpa.textContent = currentData.ipa || '';
      statusBanner.classList.remove('complete');
      statusBanner.style.display = 'none';
      wordsContainer.innerHTML = '';

      const tokens = currentData.en.match(/([a-zA-Z0-9']+)|([^a-zA-Z0-9'\s]+)/g) || [];
      wordErrorCounts = [];
      isWatermarkActive = [];
      let wordIndex = 0;

      tokens.forEach((token) => {
        const isWord = /[a-zA-Z0-9']/.test(token);

        if (isWord) {
          const idx = wordIndex;
          wordErrorCounts[idx] = 0;
          isWatermarkActive[idx] = false;

          const wordBox = document.createElement('div');
          wordBox.className = 'word-box';

          const wrapper = document.createElement('div');
          wrapper.className = 'input-wrapper';

          const watermark = document.createElement('div');
          watermark.className = 'watermark-layer';
          watermark.id = `watermark_${idx}`;

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'word-input';
          input.dataset.target = token;
          input.dataset.index = idx;
          input.autocomplete = "off";
          input.autocorrect = "off";
          input.autocapitalize = "off";
          input.spellcheck = false;

          const charLength = Math.max(token.length, 1);
          wrapper.style.width = `calc(${charLength}ch + 1.2em)`;
          wrapper.style.minWidth = '2.5em';

          input.addEventListener('focus', () => wrapper.classList.add('focus'));
          input.addEventListener('blur', () => wrapper.classList.remove('focus'));
          input.addEventListener('input', (e) => handleWordInput(e, input, wrapper, watermark, token, idx));
          input.addEventListener('keydown', (e) => handleWordKeyDown(e, input, token, idx));

          wrapper.appendChild(watermark);
          wrapper.appendChild(input);
          wordBox.appendChild(wrapper);
          wordsContainer.appendChild(wordBox);

          wordIndex++;
        } else if (token.trim() !== '') {
          const punctSpan = document.createElement('span');
          punctSpan.className = 'punctuation';
          punctSpan.textContent = token;
          wordsContainer.appendChild(punctSpan);
        }
      });

      const restored = restore ? applyProgress() : 0;
      if (restore) checkSentenceCompletion();
      saveProgress();
      speakText(currentData.en, 1);
      setTimeout(() => {
        const inputs = Array.from(wordsContainer.querySelectorAll('input'));
        const firstEmpty = inputs.find(i => !i.classList.contains('correct'));
        const target = firstEmpty || inputs[inputs.length - 1];
        if (target) target.focus();
      }, 50);

      if (restored > 0) {
        toast('已接續上次進度：第 ' + (currentIndex + 1) + ' 句，已打好 ' + restored + ' 個字');
      } else if (restore && currentIndex > 0) {
        toast('已回到上次練習的第 ' + (currentIndex + 1) + ' 句（共 ' + dataset.length + ' 句）');
      }
    }

    function updateWatermark(input, watermarkLayer, targetWord) {
      const typed = input.value;
      if (targetWord.toLowerCase().startsWith(typed.toLowerCase())) {
        const typedLen = typed.length;
        const matchedPart = targetWord.substring(0, typedLen);
        const remainingPart = targetWord.substring(typedLen);
        watermarkLayer.innerHTML = `<span class="wm-typed">${matchedPart}</span><span class="wm-untyped">${remainingPart}</span>`;
      } else {
        watermarkLayer.innerHTML = `<span class="wm-untyped">${targetWord}</span>`;
      }
    }

    function handleWordInput(e, input, wrapper, watermarkLayer, targetWord, wordIdx) {
      const value = input.value;
      if (!targetWord.toLowerCase().startsWith(value.toLowerCase())) {
        input.classList.add('error');
        wrapper.classList.add('error');
        wrapper.classList.remove('correct');
        input.classList.remove('correct');
        wordErrorCounts[wordIdx]++;

        // 錯滿 3 次即觸發浮水印與朗讀
        if (wordErrorCounts[wordIdx] >= 3) {
          isWatermarkActive[wordIdx] = true;
          updateWatermark(input, watermarkLayer, targetWord);
          const repeatTimes = parseInt(repeatCountSelect.value, 10) || 3;
          speakText(targetWord, repeatTimes);
        }
      } else {
        input.classList.remove('error');
        wrapper.classList.remove('error');

        if (isWatermarkActive[wordIdx]) {
          updateWatermark(input, watermarkLayer, targetWord);
        }

        if (value.toLowerCase() === targetWord.toLowerCase()) {
          input.value = targetWord;
          watermarkLayer.innerHTML = '';
          input.classList.add('correct');
          wrapper.classList.add('correct');
          focusNextInput(wordIdx);
          checkSentenceCompletion();
          saveProgress();
        }
      }
    }

    function handleWordKeyDown(e, input, targetWord, wordIdx) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (isSentenceComplete()) {
          nextCard();
        } else {
          speakText(targetWord, 1);
        }
        return;
      }
      if (input.classList.contains('error')) {
        if (e.key !== 'Backspace' && e.key !== 'Delete' && !e.ctrlKey && !e.altKey && e.key !== 'Enter') {
          e.preventDefault();
        }
      }
    }

    function focusNextInput(currentIdx) {
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      if (currentIdx + 1 < inputs.length) {
        inputs[currentIdx + 1].focus();
      }
    }

    function isSentenceComplete() {
      const inputs = Array.from(wordsContainer.querySelectorAll('input'));
      return inputs.every(input => input.value.toLowerCase() === input.dataset.target.toLowerCase());
    }

    function checkSentenceCompletion() {
      const done = isSentenceComplete();
      statusBanner.classList.toggle('complete', done);
      statusBanner.style.display = done ? 'flex' : 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === "'" || e.code === 'Quote')) {
        e.preventDefault();
        speakText(dataset[currentIndex].en, 1);
        return;
      }
      if (e.altKey && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        nextCard();
        return;
      }
      if (e.altKey && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        prevCard();
        return;
      }
      if (e.key === 'Escape' && explainPanel.classList.contains('open')) {
        closeExplain();
        return;
      }
      if (e.key === 'Enter') {
        const isModalOpen = importModal.style.display === 'flex';
        if (!isModalOpen && !explainPanel.classList.contains('open')) {
          e.preventDefault();
          renderCard(currentIndex);
        }
      }
      if (document.activeElement.tagName !== 'TEXTAREA') {
        if (e.key === 'ArrowRight') nextCard();
        else if (e.key === 'ArrowLeft') prevCard();
      }
    });

    function nextCard() {
      if (currentIndex < dataset.length - 1) renderCard(currentIndex + 1);
    }
    function prevCard() {
      if (currentIndex > 0) renderCard(currentIndex - 1);
    }

    prevCardBtn.addEventListener('click', prevCard);
    nextCardBtn.addEventListener('click', nextCard);
    speakFullBtn.addEventListener('click', () => speakText(dataset[currentIndex].en, 1));
    restartBtn.addEventListener('click', () => renderCard(currentIndex));

    /* ================= 句庫管理 ================= */
    openImportBtn.addEventListener('click', () => {
      refreshBankPanel();
      importModal.style.display = 'flex';
    });
    closeImportBtn.addEventListener('click', () => { importModal.style.display = 'none'; });
    cancelImportBtn.addEventListener('click', () => { importModal.style.display = 'none'; });

    useRepoBtn.addEventListener('click', () => {
      localRaw = '';
      removeStore(STORAGE_BANK);
      progress = { index: 0, sentence: '', correct: [] };
      removeStore(STORAGE_PROGRESS);
      dataset = parseRawText(currentRaw());
      if (dataset.length === 0) dataset = parseRawText(defaultRawText);
      renderCard(0, true);
      refreshBankPanel();
      toast('已改用 GitHub 上的共用句庫');
    });

    submitImportBtn.addEventListener('click', () => {
      const customText = importTextarea.value.trim();
      if (!customText) return;
      const parsed = parseRawText(customText);
      if (parsed.length === 0) {
        alert('無法解析，請確認格式為：英文 = 中文 = 音標');
        return;
      }
      localRaw = customText;
      writeStore(STORAGE_BANK, customText);
      progress = { index: 0, sentence: '', correct: [] };
      removeStore(STORAGE_PROGRESS);
      dataset = parsed;
      renderCard(0, true);
      refreshBankPanel();
      importModal.style.display = 'none';
      toast('已匯入 ' + parsed.length + ' 句，進度從第 1 句重新開始');
    });

    document.getElementById('copyDataBtn').addEventListener('click', async () => {
      const text = exportText.value;
      try {
        await navigator.clipboard.writeText(text);
        toast('已複製，貼回專案的 data/sentences.js 再 push 即可');
      } catch (e) {
        exportText.removeAttribute('readonly');
        exportText.select();
        try { document.execCommand('copy'); } catch (e2) {}
        exportText.setAttribute('readonly', 'readonly');
        toast('已複製到剪貼簿');
      }
    });

    document.getElementById('downloadDataBtn').addEventListener('click', () => {
      const blob = new Blob([exportText.value], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sentences.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('已下載 sentences.js，放進專案的 data/ 資料夾後 git push');
    });

    document.getElementById('clearLocalBtn').addEventListener('click', () => {
      if (!confirm('確定要清除這台裝置的句庫與練習進度嗎？\n（GitHub 上的共用句庫不受影響）')) return;
      removeStore(STORAGE_BANK);
      removeStore(STORAGE_PROGRESS);
      localRaw = '';
      progress = { index: 0, sentence: '', correct: [] };
      dataset = parseRawText(currentRaw());
      if (dataset.length === 0) dataset = parseRawText(defaultRawText);
      renderCard(0, true);
      refreshBankPanel();
      toast('已清除本機記錄');
    });

    /* ================= 解析這一句 ================= */
    const ANALYSIS = (typeof window.SENTENCE_ANALYSIS === 'object' && window.SENTENCE_ANALYSIS) || {};

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 把文字裡的 (O) / (X) 變成綠色 / 紅色標記
    function rich(str) {
      return escapeHtml(str).replace(/\((O|X)\)/g, '<span class="mark mark-$1">($1)</span>');
    }

    // 句庫裡還沒有老師解析時，用這些規則產生自我檢查提示
    const NOT_PLURAL = {
      is: 1, was: 1, has: 1, this: 1, his: 1, its: 1, as: 1, us: 1, yes: 1,
      always: 1, sometimes: 1, news: 1, mathematics: 1, physics: 1
    };

    function autoAnalysis(card) {
      const en = card.en;
      const items = [];

      if (/\b(is|am|are|was|were)\b/i.test(en)) {
        const be = en.match(/\b(is|am|are|was|were)\b/i)[1];
        const swap = { is: 'are', am: 'is', are: 'is', was: 'were', were: 'was' }[be.toLowerCase()];
        items.push({
          point: 'be 動詞',
          ok: en,
          bad: en.replace(new RegExp('\\b' + be + '\\b', 'i'), swap),
          why: '這一句用 be 動詞表示狀態或身分。判斷方式：「I 用 am」、「you / we / they 用 are」、「he / she / it 單數用 is」。'
        });
      }

      if (/\bof\b/i.test(en)) {
        const after = (en.match(/\bof\s+([A-Za-z' -]+)/i) || [])[1] || '';
        items.push({
          point: '介系詞 of',
          ok: 'of ' + (after || '名詞'),
          bad: 'of ' + (after ? after.replace(/s$/, '') : '動詞原形'),
          why: 'of 是介系詞，後面一定要接名詞（或 -ing 形式），不能接動詞原形。看到 of 就先檢查後面的名詞要不要加 s。'
        });
      }

      const plurals = (en.match(/[A-Za-z']+/g) || [])
        .map(w => w.toLowerCase())
        .filter(w => /s$/.test(w) && w.length > 2 && !NOT_PLURAL[w] && !/ss$/.test(w) && !/us$/.test(w));
      if (plurals.length) {
        items.push({
          point: '名詞複數',
          ok: plurals.join(' / '),
          bad: plurals.map(w => w.replace(/es$/, '').replace(/s$/, '')).join(' / '),
          why: '複數名詞的 s 一定要留。一般名詞直接加 s；以 s / x / ch / sh 結尾加 es；輔音字母 + y 結尾要把 y 變 i 再加 es。'
        });
      }

      const modal = en.match(/\b(can|could|should|would|will|must)\s+([a-z']+)/i);
      if (modal) {
        const base = modal[2].replace(/s$/, '');
        items.push({
          point: '情態動詞 + 動詞原形',
          ok: modal[1] + ' ' + base,
          bad: modal[1] + ' to ' + base,
          why: 'can / could / should / would / will / must 後面一律接動詞原形：不加 to、不加 -s、不加 -ing。'
        });
      }

      if (!items.length) {
        items.push({
          point: '句子結構自我檢查',
          ok: en,
          bad: '請同學找出自己最容易漏掉的那個字',
          why: '這一句還沒有老師寫好的逐項解析。先用三個檢查：「① 主詞和動詞有沒有配對」、「② 名詞該不該加 s」、「③ 介系詞（in / on / at / of / for）放對了嗎」。'
        });
      }

      return {
        headline: '這一句目前只有 App 自動產生的自我檢查提示，老師的詳細解析還沒加入。',
        items: items,
        examples: [],
        traps: [
          '整句打完後再從頭唸一次，特別檢查 s、a / an / the、介系詞這三個地方。',
          '同一個字錯到第 3 次時 App 會自動朗讀，這時請跟著唸，注意每個字的音。'
        ],
        strategy: [
          '想讓這一句也有完整解析，把內容加到專案的 data/analysis.js，所有裝置就會共用。',
          '每天練完一句，把錯的那個字圈起來，隔天複習一次，比整句重打有效。'
        ]
      };
    }

    function currentAnalysis() {
      const card = dataset[currentIndex];
      if (!card) return null;
      const found = ANALYSIS[card.en] || ANALYSIS[card.en.replace(/[.?!]+$/, '')] || ANALYSIS[card.en.trim()];
      return { card: card, data: found || autoAnalysis(card), fromLibrary: !!found };
    }

    function renderExplain() {
      const entry = currentAnalysis();
      if (!entry) return;
      const card = entry.card;
      const a = entry.data;

      explainSub.textContent = '第 ' + (currentIndex + 1) + ' 句 / 共 ' + dataset.length + ' 句'
        + (entry.fromLibrary ? '' : '　·　自動提示');

      let html = '';

      html += '<div class="ex-sentence">';
      html += '<div class="ex-sentence__en">' + rich('(O) ' + card.en) + '</div>';
      html += '<div class="ex-sentence__meta">中文：' + escapeHtml(card.zh || '—');
      if (card.ipa) html += '<br>音標：<span class="ex-sentence__ipa">' + escapeHtml(card.ipa) + '</span>';
      html += '</div></div>';

      if (a.headline) html += '<div class="ex-headline">' + rich(a.headline) + '</div>';

      if (a.items && a.items.length) {
        html += '<section class="ex-section"><h3 class="ex-section__title">一、逐項對照表</h3>';
        html += '<table class="ex-table"><thead><tr>'
              + '<th>項目</th><th>正確版本</th><th>學生常犯錯誤</th><th>錯誤原因解析</th>'
              + '</tr></thead><tbody>';
        a.items.forEach(it => {
          html += '<tr>'
            + '<td data-label="項目"><strong>' + rich(it.point || '') + '</strong></td>'
            + '<td class="en ex-cell--ok" data-label="正確版本">' + rich('(O) ' + (it.ok || '')) + '</td>'
            + '<td class="en ex-cell--bad" data-label="常見錯誤">' + rich('(X) ' + (it.bad || '')) + '</td>'
            + '<td data-label="解析">' + rich(it.why || '')
            + (it.exam ? '<br><span style="color:var(--text-muted)">📌 ' + rich(it.exam) + '</span>' : '')
            + '</td></tr>';
        });
        html += '</tbody></table></section>';
      }

      if (a.examples && a.examples.length) {
        html += '<section class="ex-section"><h3 class="ex-section__title">二、範例兩句（一對一錯）</h3><div class="ex-examples">';
        a.examples.forEach(ex => {
          const ok = ex.ok !== false;
          html += '<div class="ex-example ' + (ok ? 'ex-example--ok' : 'ex-example--bad') + '">'
            + '<div class="ex-example__text">' + rich((ok ? '(O) ' : '(X) ') + (ex.text || '')) + '</div>'
            + '<div class="ex-example__note">' + rich(ex.note || '') + '</div>'
            + '</div>';
        });
        html += '</div></section>';
      }

      if (a.traps && a.traps.length) {
        html += '<section class="ex-section"><h3 class="ex-section__title">三、國中教育會考陷阱提醒</h3><ul class="ex-list">';
        a.traps.forEach(t => { html += '<li>' + rich(t) + '</li>'; });
        html += '</ul></section>';
      }

      if (a.strategy && a.strategy.length) {
        html += '<section class="ex-section"><h3 class="ex-section__title">四、實戰建議</h3><ul class="ex-list">';
        a.strategy.forEach(t => { html += '<li>' + rich(t) + '</li>'; });
        html += '</ul></section>';
      }

      if (!entry.fromLibrary) {
        html += '<p class="ex-empty">這一句還沒有老師寫好的完整解析，上方表格是 App 依句型自動產生的自我檢查提示。'
              + '把內容補到專案的 data/analysis.js 並 git push，所有裝置就會共用同一份解析。</p>';
      }

      explainBody.innerHTML = html;
      explainBody.scrollTop = 0;
    }

    function openExplain() {
      renderExplain();
      explainPanel.classList.add('open');
      explainScrim.classList.add('open');
    }

    function closeExplain() {
      explainPanel.classList.remove('open');
      explainScrim.classList.remove('open');
    }

    explainBtn.addEventListener('click', openExplain);
    explainClose.addEventListener('click', closeExplain);
    explainScrim.addEventListener('click', closeExplain);

    /* ================= 啟動：接續上次的進度 ================= */
    loadProgress();
    dataset = parseRawText(currentRaw());
    if (dataset.length === 0) dataset = parseRawText(defaultRawText);
    const resumeIndex = Math.min(Math.max(progress.index, 0), Math.max(dataset.length - 1, 0));
    renderCard(resumeIndex, true);

    // #解析 / #explain：這一頁如果已經打完，直接開啟解析面板（方便分享、也方便測試）
    // 注意：location.hash 遇到中文會回傳百分比編碼，必須先 decode 再比對
    const pageHash = decodeURIComponent(location.hash || '').toLowerCase();
    if (pageHash === '#解析' || pageHash === '#explain') {
      setTimeout(() => {
        if (isSentenceComplete()) openExplain();
        else toast('先把這一句打完，才會出現「解析這一句」');
      }, 400);
    }
  </script>
</body>
</html>
