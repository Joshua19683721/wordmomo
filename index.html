<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordMomo — 漸進式英語學習</title>
<meta name="description" content="WordMomo：由單字、詞組、句子到完整段落的漸進式英語打字練習。">
<meta name="theme-color" content="#0c0d1a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 啟動畫面 -->
<div id="splash" class="splash">
  <div class="splash__logo">momo</div>
  <div class="splash__bar"><i></i></div>
</div>

<!-- 頂部列 -->
<header class="topbar">
  <a class="brand" href="#/" aria-label="回到儀表板"><span class="brand__mark">momo</span></a>

  <nav class="nav" id="nav">
    <a class="nav__link" href="#/"      data-view="dashboard"><span class="nav__ico">◎</span>儀表板</a>
    <a class="nav__link" href="#/learn" data-view="learn"><span class="nav__ico">✎</span>學習</a>
    <a class="nav__link" href="#/packs" data-view="packs"><span class="nav__ico">▤</span>字庫</a>
    <a class="nav__link" href="#/stats" data-view="stats"><span class="nav__ico">▦</span>統計</a>
  </nav>

  <div class="topbar__right">
    <div class="streak-chip" id="streakChip" title="連續學習天數">
      <span class="streak-chip__flame">🔥</span>
      <span id="streakNum">0</span><span class="streak-chip__unit">天</span>
    </div>
    <button class="icon-btn" id="themeBtn" title="切換深色／淺色" aria-label="切換佈景主題">◐</button>
    <button class="icon-btn" data-open-settings title="設定" aria-label="開啟設定">⚙</button>
  </div>
</header>

<!-- 主要內容 -->
<main id="app" class="app" role="main"></main>

<!-- 底部行動列 -->
<nav class="tabbar" id="tabbar">
  <a class="tabbar__link" href="#/"      data-view="dashboard"><span>◎</span>儀表板</a>
  <a class="tabbar__link" href="#/learn" data-view="learn"><span>✎</span>學習</a>
  <a class="tabbar__link" href="#/packs" data-view="packs"><span>▤</span>字庫</a>
  <a class="tabbar__link" href="#/stats" data-view="stats"><span>▦</span>統計</a>
</nav>

<!-- 設定抽屜 -->
<div class="drawer" id="settingsDrawer" hidden>
  <div class="drawer__scrim" data-close-drawer></div>
  <div class="drawer__panel" role="dialog" aria-label="設定">
    <header class="drawer__head">
      <h2>設定</h2>
      <button class="icon-btn" data-close-drawer aria-label="關閉">✕</button>
    </header>
    <div class="drawer__body">
      <section class="field">
        <label for="setGoal">每日目標（完成幾個步驟）</label>
        <div class="field__row">
          <input type="range" id="setGoal" min="5" max="100" step="5">
          <output id="setGoalOut">20</output>
        </div>
      </section>

      <section class="field">
        <label for="setSpeechRate">發音語速</label>
        <div class="field__row">
          <input type="range" id="setSpeechRate" min="0.5" max="1.3" step="0.05">
          <output id="setSpeechRateOut">0.90</output>
        </div>
      </section>

      <section class="field">
        <label for="setVoice">發音聲音</label>
        <select id="setVoice"></select>
        <p class="hint" id="voiceHint">正在偵測瀏覽器語音…</p>
      </section>

      <section class="field field--row">
        <label for="setAutoPlay">換步驟時自動發音</label>
        <input type="checkbox" id="setAutoPlay" class="switch">
      </section>

      <section class="field field--row">
        <label for="setTypeSound">打字音效</label>
        <input type="checkbox" id="setTypeSound" class="switch">
      </section>

      <section class="field">
        <div class="btn-row">
          <button class="btn btn--ghost" id="exportBtn">匯出全部進度</button>
          <button class="btn btn--ghost" id="importBtn">匯入進度</button>
        </div>
        <input type="file" id="importFile" accept="application/json" hidden>
        <p class="hint">包含字庫內容與學習紀錄，換瀏覽器或換裝置時用。</p>
      </section>

      <section class="field">
        <div class="btn-row">
          <button class="btn btn--ghost" id="clearProgressBtn">只清除學習紀錄</button>
          <button class="btn btn--danger" id="resetBtn">全部重設為內建字庫</button>
        </div>
        <p class="hint">「全部重設」會把你自訂的字庫也一併刪掉，無法復原。</p>
      </section>
    </div>
  </div>
</div>

<!-- 字庫編輯視窗 -->
<div class="modal" id="packModal" hidden>
  <div class="modal__scrim" data-close-modal></div>
  <div class="modal__panel" role="dialog" aria-label="編輯字庫">
    <header class="modal__head">
      <h2 id="packModalTitle">編輯字庫</h2>
      <button class="icon-btn" data-close-modal aria-label="關閉">✕</button>
    </header>
    <div class="modal__body" id="packModalBody"></div>
    <footer class="modal__foot">
      <button class="btn btn--ghost" data-close-modal>取消</button>
      <button class="btn btn--primary" id="packModalDone">儲存並關閉</button>
    </footer>
  </div>
</div>

<!-- 匯出預覽視窗 -->
<div class="modal" id="exportModal" hidden>
  <div class="modal__scrim" data-close-modal></div>
  <div class="modal__panel" role="dialog" aria-label="匯出字庫程式碼">
    <header class="modal__head">
      <h2>匯出成 js/data.js 片段</h2>
      <button class="icon-btn" data-close-modal aria-label="關閉">✕</button>
    </header>
    <div class="modal__body">
      <p class="hint" style="margin-bottom:12px">
        複製下面整段，貼回專案的 <code>js/data.js</code> 取代舊內容，
        再 <code>git push</code> 就會變成所有裝置共用的固定版本。
      </p>
      <div class="field__row" style="margin-bottom:10px; flex-wrap:wrap">
        <select id="exportScope" class="input" style="max-width:220px">
          <option value="all">全部字庫</option>
        </select>
        <button class="btn btn--primary" id="copyExportBtn">複製</button>
        <button class="btn btn--ghost" id="downloadExportBtn">下載 data.js</button>
      </div>
      <textarea id="exportText" class="input code-area" readonly rows="18" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
